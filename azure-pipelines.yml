trigger:
  branches:
    include:
    - "dev"
    - "uat"
    - "prod"
    - "sit"
pr:
  branches:
    exclude:
    - "*"

pool:
  vmImage: "ubuntu-latest"

variables:
  isMain: $[eq(variables['Build.SourceBranchName'], 'main')]

resources:
  repositories:
  - repository: bf-common-utils # The name used to reference this repository in the checkout step
    type: github
    endpoint: multimatrixlimited
    name: multimatrixlimited/bf-common-utils
  - repository: bf-model 
    type: github
    endpoint: multimatrixlimited
    name: multimatrixlimited/bf-model
steps:
- checkout: self
- checkout: bf-common-utils
- script: |
    cd auth2fa
    SHORT_COMMIT=$(git rev-parse --short HEAD)
    echo "##vso[task.setvariable variable=SHORT_COMMIT]$SHORT_COMMIT"
    repo_name=$(echo $(Build.Repository.Name) | cut -d'/' -f2)
    # Extract the branch name directly from the predefined variable
    branch_name=$(Build.SourceBranchName)
    repo_name=$(echo $(Build.Repository.Name) | cut -d'/' -f2)
    repository_name=${branch_name}-$repo_name
    echo "##vso[task.setvariable variable=REPOSITORY_NAME]$repository_name"
    ./build.sh ${repository_name}:latest
    cd -
- ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/uat') }}:
  - task: ECRPushImage@1
    inputs:
      awsCredentials: 'uat-aws'
      regionName: 'eu-west-1'
      imageSource: 'imagename'
      sourceImageName: '$(REPOSITORY_NAME)'
      sourceImageTag: 'latest'
      repositoryName: '$(REPOSITORY_NAME)'
      pushTag: $(Build.SourceBranchName)-$(SHORT_COMMIT)-$(Build.BuildId)
  - task: ECRPushImage@1
    inputs:
      awsCredentials: "uat-aws"
      regionName: "eu-west-1"
      imageSource: "imagename"
      sourceImageName: "$(REPOSITORY_NAME)"
      sourceImageTag: "latest"
      repositoryName: "$(REPOSITORY_NAME)"
      pushTag: latest
- ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/sit') }}:
  - task: ECRPushImage@1
    inputs:
      awsCredentials: 'sit-aws'
      regionName: 'eu-west-1'
      imageSource: 'imagename'
      sourceImageName: '$(REPOSITORY_NAME)'
      sourceImageTag: 'latest'
      repositoryName: '$(REPOSITORY_NAME)'
      pushTag: $(Build.SourceBranchName)-$(SHORT_COMMIT)-$(Build.BuildId)
  - task: ECRPushImage@1
    inputs:
      awsCredentials: "sit-aws"
      regionName: "eu-west-1"
      imageSource: "imagename"
      sourceImageName: "$(REPOSITORY_NAME)"
      sourceImageTag: "latest"
      repositoryName: "$(REPOSITORY_NAME)"
      pushTag: latest
- ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/dev') }}:
  - task: ECRPushImage@1
    inputs:
      awsCredentials: "dev-aws"
      regionName: "eu-west-1"
      imageSource: "imagename"
      sourceImageName: "$(REPOSITORY_NAME)"
      sourceImageTag: "latest"
      repositoryName: "$(REPOSITORY_NAME)"
      pushTag: $(Build.SourceBranchName)-$(SHORT_COMMIT)-$(Build.BuildId)
  - task: ECRPushImage@1
    inputs:
      awsCredentials: "dev-aws"
      regionName: "eu-west-1"
      imageSource: "imagename"
      sourceImageName: "$(REPOSITORY_NAME)"
      sourceImageTag: "latest"
      repositoryName: "$(REPOSITORY_NAME)"
      pushTag: latest
- ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/prod') }}:
  - task: ECRPushImage@1
    inputs:
      awsCredentials: "prod-aws"
      regionName: "eu-west-1"
      imageSource: "imagename"
      sourceImageName: "$(REPOSITORY_NAME)"
      sourceImageTag: "latest"
      repositoryName: "$(REPOSITORY_NAME)"
      pushTag: $(Build.SourceBranchName)-$(SHORT_COMMIT)-$(Build.BuildId)
  - task: ECRPushImage@1
    inputs:
      awsCredentials: "prod-aws"
      regionName: "eu-west-1"
      imageSource: "imagename"
      sourceImageName: "$(REPOSITORY_NAME)"
      sourceImageTag: "latest"
      repositoryName: "$(REPOSITORY_NAME)"
      pushTag: latest
